name: Public experience browser checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-nextauth-secret-with-at-least-32-characters
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/avara-playwright" --no-package-lock --no-audit --no-fund @playwright/test@1.51.1
          echo "NODE_PATH=$RUNNER_TEMP/avara-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Install Chromium and supported system dependencies
        run: '"$RUNNER_TEMP/avara-playwright/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Run public browser checks
        run: '"$RUNNER_TEMP/avara-playwright/node_modules/.bin/playwright" test --config=playwright.config.cjs'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
