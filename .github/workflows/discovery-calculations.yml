name: Property calculator tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/discovery-calculations.cjs tests/discovery-listing-query.cjs tests/rental-match.cjs tests/discovery-studios.cjs tests/rental-input.cjs
